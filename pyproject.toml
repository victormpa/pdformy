[project]
name = "pdformy"
version = "0.1.0"
description = ""
authors = [{ name = "victormpa", email = "victor.martins.dpaula@gmail.com" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fpdf2 (>=2.8.8,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "mistletoe (>=1.6.0,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "click (>=8.5.0,<9.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
]

[project.scripts]
pdformy = "pdformy.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "pdformy" }]

[dependency-groups]
dev = ["pytest (>=9.1.1,<10.0.0)", "pypdf (>=6.19.0,<7.0.0)", "mkdocs (>=1.6.1,<2.0.0)", "pytest-cov (>=7.1.0,<8.0.0)"]
