  - title: Protocol summary
    content:
      - text: |
          This report summarises the real-time stability programme for **Lot LOT-4412**.
          Samples were stored at 25 C / 60% RH and pulled at the scheduled intervals.

          Acceptance criteria follow ICH Q1A. No OOS results were observed through
          the 24-month time point.

